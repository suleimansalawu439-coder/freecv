<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cvyon Matcher</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      margin: 0;
      color: #0f172a;
    }
    h1 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 12px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    button {
      background-color: #000;
      color: #fff;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: bold;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background-color: #333;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Cvyon Job Matcher</h1>
  <p style="font-size: 13px; margin-bottom: 16px; color: #475569;">
    Automatically extract the job description on this page and score it against your Cvyon resume.
  </p>
  <button id="extractBtn">Score My Match</button>
  <div class="status" id="statusText">Ready</div>
  
  <script type="module" src="popup.js"></script>
</body>
</html>
